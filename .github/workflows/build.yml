name: Build portable .exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Install Tesseract (bundled into the .exe)
        run: choco install tesseract -y --no-progress
      - name: Prepare OCR engine and language models
        run: python scripts/prepare_tesseract.py
      - name: Build executable
        shell: bash
        run: |
          ICON=""
          if [ -f assets/icon.ico ]; then ICON="--icon assets/icon.ico"; fi
          pyinstaller --noconfirm --clean --onefile --windowed --name TidyFolder $ICON \
            --add-data "vendor/tesseract;tesseract" \
            --collect-all customtkinter --collect-all pypdfium2 --collect-all pypdfium2_raw \
            --hidden-import keyring.backends.Windows run.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TidyFolder-portable-windows
          path: dist/TidyFolder.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TidyFolder.exe
          generate_release_notes: true
